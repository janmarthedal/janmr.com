<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 420" width="556" height="420" font-family="Helvetica, Arial, sans-serif">
  <title>Round-robin schedule for 6 players by the circle method</title>
  <rect width="556" height="420" fill="#fff"/>
  <text x="278" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">6 players, 5 rounds, 3 matches each</text>
  <text x="278" y="64" text-anchor="middle" font-size="15" fill="#666">Player 1 stays put; the rest rotate one step each round</text>
  <g>
    <text x="106" y="118" text-anchor="middle" font-size="15" fill="#666">Round 1</text>
    <line x1="60" y1="152" x2="60" y2="214" stroke="#888" stroke-width="2"/>
    <line x1="106" y1="152" x2="106" y2="214" stroke="#888" stroke-width="2"/>
    <line x1="152" y1="152" x2="152" y2="214" stroke="#888" stroke-width="2"/>
    <circle cx="60" cy="152" r="17" fill="#333" stroke="#333" stroke-width="2"/>
    <text x="60" y="159" text-anchor="middle" font-size="19" fill="#fff">1</text>
    <circle cx="60" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="60" y="221" text-anchor="middle" font-size="19" fill="#222">6</text>
    <circle cx="106" cy="152" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="106" y="159" text-anchor="middle" font-size="19" fill="#222">2</text>
    <circle cx="106" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="106" y="221" text-anchor="middle" font-size="19" fill="#222">5</text>
    <circle cx="152" cy="152" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="152" y="159" text-anchor="middle" font-size="19" fill="#222">3</text>
    <circle cx="152" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="152" y="221" text-anchor="middle" font-size="19" fill="#222">4</text>
  </g>
  <g>
    <text x="278" y="118" text-anchor="middle" font-size="15" fill="#666">Round 2</text>
    <line x1="232" y1="152" x2="232" y2="214" stroke="#888" stroke-width="2"/>
    <line x1="278" y1="152" x2="278" y2="214" stroke="#888" stroke-width="2"/>
    <line x1="324" y1="152" x2="324" y2="214" stroke="#888" stroke-width="2"/>
    <circle cx="232" cy="152" r="17" fill="#333" stroke="#333" stroke-width="2"/>
    <text x="232" y="159" text-anchor="middle" font-size="19" fill="#fff">1</text>
    <circle cx="232" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="232" y="221" text-anchor="middle" font-size="19" fill="#222">5</text>
