    <line x1="496" y1="152" x2="496" y2="214" stroke="#888" stroke-width="2"/>
    <circle cx="404" cy="152" r="17" fill="#333" stroke="#333" stroke-width="2"/>
    <text x="404" y="159" text-anchor="middle" font-size="19" fill="#fff">1</text>
    <circle cx="404" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="404" y="221" text-anchor="middle" font-size="19" fill="#222">4</text>
    <circle cx="450" cy="152" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="450" y="159" text-anchor="middle" font-size="19" fill="#222">5</text>
    <circle cx="450" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
