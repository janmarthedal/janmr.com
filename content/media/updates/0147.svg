    <circle cx="496" cy="152" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="496" y="159" text-anchor="middle" font-size="19" fill="#222">6</text>
    <circle cx="496" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="496" y="221" text-anchor="middle" font-size="19" fill="#222">2</text>
  </g>
  <g>
    <text x="192" y="278" text-anchor="middle" font-size="15" fill="#666">Round 4</text>
    <line x1="146" y1="312" x2="146" y2="374" stroke="#888" stroke-width="2"/>
    <line x1="192" y1="312" x2="192" y2="374" stroke="#888" stroke-width="2"/>
    <line x1="238" y1="312" x2="238" y2="374" stroke="#888" stroke-width="2"/>
    <circle cx="146" cy="312" r="17" fill="#333" stroke="#333" stroke-width="2"/>
    <text x="146" y="319" text-anchor="middle" font-size="19" fill="#fff">1</text>
    <circle cx="146" cy="374" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="146" y="381" text-anchor="middle" font-size="19" fill="#222">3</text>
    <circle cx="192" cy="312" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="192" y="319" text-anchor="middle" font-size="19" fill="#222">4</text>
    <circle cx="192" cy="374" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="192" y="381" text-anchor="middle" font-size="19" fill="#222">2</text>
    <circle cx="238" cy="312" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="238" y="319" text-anchor="middle" font-size="19" fill="#222">5</text>
    <circle cx="238" cy="374" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="238" y="381" text-anchor="middle" font-size="19" fill="#222">6</text>
  </g>
  <g>
    <text x="364" y="278" text-anchor="middle" font-size="15" fill="#666">Round 5</text>
    <line x1="318" y1="312" x2="318" y2="374" stroke="#888" stroke-width="2"/>
    <line x1="364" y1="312" x2="364" y2="374" stroke="#888" stroke-width="2"/>
    <line x1="410" y1="312" x2="410" y2="374" stroke="#888" stroke-width="2"/>
    <circle cx="318" cy="312" r="17" fill="#333" stroke="#333" stroke-width="2"/>
    <text x="318" y="319" text-anchor="middle" font-size="19" fill="#fff">1</text>
    <circle cx="318" cy="374" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="318" y="381" text-anchor="middle" font-size="19" fill="#222">2</text>
    <circle cx="364" cy="312" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="364" y="319" text-anchor="middle" font-size="19" fill="#222">3</text>
    <circle cx="364" cy="374" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="364" y="381" text-anchor="middle" font-size="19" fill="#222">6</text>
    <circle cx="410" cy="312" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="410" y="319" text-anchor="middle" font-size="19" fill="#222">4</text>
    <circle cx="410" cy="374" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="410" y="381" text-anchor="middle" font-size="19" fill="#222">5</text>
