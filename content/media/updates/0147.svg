    <text x="278" y="159" text-anchor="middle" font-size="19" fill="#222">6</text>
    <circle cx="278" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="278" y="221" text-anchor="middle" font-size="19" fill="#222">4</text>
    <circle cx="324" cy="152" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="324" y="159" text-anchor="middle" font-size="19" fill="#222">2</text>
    <circle cx="324" cy="214" r="17" fill="#eee" stroke="#333" stroke-width="2"/>
    <text x="324" y="221" text-anchor="middle" font-size="19" fill="#222">3</text>
  </g>
  <g>
    <text x="450" y="118" text-anchor="middle" font-size="15" fill="#666">Round 3</text>
